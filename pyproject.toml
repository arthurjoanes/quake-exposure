[project]
name = "quake-exposure"
version = "0.3.0"
description = "Exposição de uma carteira fictícia a terremotos do USGS (ShakeMap)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Arthur Joanes" }]
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka==2.15.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
qe = "quakeexposure.cli:main"

[dependency-groups]
dev = [
    "geographiclib>=2.1",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-defusedxml>=0.7.0.20260504",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quakeexposure"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# geographiclib não traz tipos; é só o oráculo dos testes
module = ["geographiclib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
