# Só para os testes de integração: publica o banco numa porta aleatória de 127.0.0.1.
# Uso: docker compose -p <nome> -f compose.yaml -f compose.test.yaml up -d --wait platform-db
services:
  platform-db:
    ports: ["127.0.0.1::5432"]
  source-db:
    ports: ["127.0.0.1::5432"]
  kafka:
    ports: ["127.0.0.1:${QE_TEST_KAFKA_PORT:-19092}:19092"]
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${QE_TEST_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  connect:
    ports: ["127.0.0.1:${QE_TEST_CONNECT_PORT:-0}:8083"]
